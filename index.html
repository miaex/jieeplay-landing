<!DOCTYPE html><html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JieePlay</title>
<meta name="description" content="JieePlay — Ton jeu. Tes mots. Tes surprises.">
<link rel="icon" href="favicon/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head><body><main class="lang-select-page"><div class="lang-bg-word" aria-hidden="true">Jiee</div>

<div class="lang-content">

	<div class="lang-logo" aria-label="JieePlay">
		Jiee<span>Play</span>
	</div>

	<div class="lang-divider" aria-hidden="true">
		<span></span>
		<i></i>
		<span></span>
	</div>

	<p class="lang-tagline">
		Ton jeu. Tes mots. Tes surprises.
		<br>
		<span>Your game. Your words. Your surprises.</span>
	</p>

	<div class="lang-prompt">
		<span>01</span>
		Choisis ta langue
		<small>Choose your language</small>
	</div>

	<div class="lang-buttons">

		<a href="fr/" class="lang-btn" data-lang-btn="fr" data-switch-lang="fr">
			<span class="lang-btn-main">Français</span>
			<span class="lang-btn-arrow">→</span>
		</a>

		<a href="en/" class="lang-btn" data-lang-btn="en" data-switch-lang="en">
			<span class="lang-btn-main">English</span>
			<span class="lang-btn-arrow">→</span>
		</a>

	</div>

	<p class="lang-note">
		Une expérience personnalisée vous attend.
	</p>

</div>

<div class="lang-corner lang-corner-top" aria-hidden="true"></div>
<div class="lang-corner lang-corner-bottom" aria-hidden="true"></div>

</main><script src="js/language.js"></script><script>
	suggestBrowserLanguage();

	document.querySelectorAll("[data-switch-lang]").forEach((el) => {
		el.addEventListener("click", () => {
			setLanguage(el.dataset.switchLang);
		});
	});
</script></body>
</html>
